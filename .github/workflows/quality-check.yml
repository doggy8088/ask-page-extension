name: 檢查程式碼品質

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-check:
    runs-on: ubuntu-latest
    outputs:
      run_safari_xcode: ${{ steps.safari_filter.outputs.run_safari_xcode }}

    steps:
    - name: 檢出程式碼
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: 設定 Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'

    - name: 安裝相依套件
      run: npm ci

    - name: 檢查程式碼風格 (ESLint)
      run: npm run lint

    - name: 建置多平台擴充功能
      run: npm run build

    - name: 執行測試套件
      run: npm test

    - name: 驗證各平台 Manifest 與檔案完整性
      run: |
        TARGETS=("chrome" "edge" "safari")
        FILES=("manifest.json" "background.js" "platform-adapter.js" "content.js" "popup.html" "popup.js" "settings.html" "settings.js" "codepen.html" "codepen.js" "i18n.js" "endpoint-utils.js" "agent-glow.js" "style.css" "_locales/en/messages.json" "_locales/zh_TW/messages.json" "icons/icon16.png" "icons/icon48.png" "icons/icon128.png" "lib/marked.min.js" "lib/purify.min.js")

        for target in "${TARGETS[@]}"; do
          dir="dist/$target"
          manifest="$dir/manifest.json"
          echo "檢查 $target 擴充功能 ($manifest)..."

          if ! jq empty "$manifest" 2>/dev/null; then
            echo "❌ $manifest 格式錯誤"
            exit 1
          fi

          MANIFEST_VERSION=$(jq -r '.manifest_version' "$manifest")
          if [ "$MANIFEST_VERSION" != "3" ]; then
            echo "❌ $target 不是 Manifest V3"
            exit 1
          fi

          for field in "manifest_version" "name" "version"; do
            if ! jq -e ".$field" "$manifest" > /dev/null; then
              echo "❌ $manifest 缺少必要欄位: $field"
              exit 1
            fi
          done

          if [ "$target" = "safari" ]; then
            if ! jq -e '.background.scripts | type == "array" and length > 0' "$manifest" > /dev/null; then
              echo "❌ $target background.scripts 設定錯誤或為空"
              exit 1
            fi
            while IFS= read -r bg_script; do
              if [ ! -f "$dir/$bg_script" ]; then
                echo "❌ $target 缺少背景腳本: $dir/$bg_script"
                exit 1
              fi
            done < <(jq -r '.background.scripts[]' "$manifest")
          else
            SERVICE_WORKER=$(jq -r '.background.service_worker' "$manifest" 2>/dev/null || echo "null")
            if [ "$SERVICE_WORKER" = "null" ] || [ ! -f "$dir/$SERVICE_WORKER" ]; then
              echo "❌ $target Service Worker 設定錯誤或檔案缺失"
              exit 1
            fi
          fi

          for file in "${FILES[@]}"; do
            if [ ! -f "$dir/$file" ]; then
              echo "❌ $target 缺少檔案: $dir/$file"
              exit 1
            fi
          done
        done

        echo "✅ Chrome / Edge / Safari 建置驗證全數通過"

    - name: 建立多平台測試套件
      run: |
        npm run package
        for target in chrome edge safari; do
          zip_file=$(ls dist/AskPageExtension-${target}_v*.zip | head -n 1)
          if [ ! -f "$zip_file" ]; then
            echo "❌ 找不到 $target 打包產物"
            exit 1
          fi
          SIZE=$(du -k "$zip_file" | cut -f1)
          echo "$target 套件: $zip_file (${SIZE}KB)"
          if [ "$SIZE" -gt 10240 ]; then
            echo "⚠️ 警告: $zip_file 大小超過 10MB"
          fi
        done

    - name: 判斷是否需執行 macOS Safari Xcode 編譯檢查
      id: safari_filter
      env:
        EVENT_NAME: ${{ github.event_name }}
        BEFORE_SHA: ${{ github.event.before }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        CURRENT_SHA: ${{ github.sha }}
      run: |
        PATTERN='^(src/|platforms/safari/|platforms/base/|scripts/build\.js|scripts/build-safari-dmg\.sh|\.github/workflows/quality-check\.yml$)'

        if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          echo "run_safari_xcode=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_BASE_SHA" ]; then
          BASE_SHA="$PR_BASE_SHA"
        elif [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
          BASE_SHA="$BEFORE_SHA"
        else
          echo "run_safari_xcode=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
          git fetch --no-tags --depth=1 origin "$BASE_SHA" >/dev/null 2>&1 || true
        fi

        if ! CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$CURRENT_SHA" 2>/dev/null); then
          echo "run_safari_xcode=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if printf '%s\n' "$CHANGED_FILES" | grep -Eq "$PATTERN"; then
          echo "run_safari_xcode=true" >> "$GITHUB_OUTPUT"
        else
          echo "run_safari_xcode=false" >> "$GITHUB_OUTPUT"
        fi

    - name: 程式碼品質總結
      run: |
        echo "## 程式碼品質檢查完成 ✅" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 檢查項目:" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ ESLint 程式碼風格檢查" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ 多平台建置 (Chrome / MS Edge / Safari)" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ 單元與整合測試套件 (npm test)" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ 各平台 manifest.json 與檔案完整性檢查" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ 三平台套件打包測試 (npm run package)" >> $GITHUB_STEP_SUMMARY
        if [ "${{ steps.safari_filter.outputs.run_safari_xcode }}" = "true" ]; then
          echo "- ⏳ 將接續於 macOS Runner 驗證 Safari Xcode 編譯" >> $GITHUB_STEP_SUMMARY
        else
          echo "- ⏭️ 本次未異動 Safari 相關檔案，略過 macOS Xcode 編譯檢查" >> $GITHUB_STEP_SUMMARY
        fi

  safari-xcode-check:
    needs: quality-check
    if: needs.quality-check.outputs.run_safari_xcode == 'true'
    runs-on: macos-latest

    steps:
    - name: 檢出程式碼
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: 設定 Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'

    - name: 安裝相依套件與建置 Safari 資源
      run: |
        npm ci
        npm run build:safari

    - name: 驗證 macOS Safari Xcode 專案編譯
      run: |
        xcodebuild \
          -project platforms/safari/xcode/AskPage/AskPage.xcodeproj \
          -scheme "AskPage" \
          -configuration Debug \
          -destination "generic/platform=macOS" \
          CODE_SIGNING_ALLOWED=NO \
          build

    - name: Safari Xcode 檢查總結
      run: |
        echo "## macOS Safari Xcode 編譯檢查通過 ✅" >> "$GITHUB_STEP_SUMMARY"
        echo "- ✅ \`npm run build:safari\` 與 \`xcodebuild\`（未簽署檢查）皆成功。" >> "$GITHUB_STEP_SUMMARY"
