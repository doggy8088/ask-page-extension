name: Safari 自動打包與上架 (Developer ID DMG & App Store Connect)

on:
  workflow_call:
    inputs:
      version:
        description: '擴充功能版本號 (不含 v 前綴，例如 0.52.0)'
        required: false
        type: string
      tag_name:
        description: 'GitHub Release 標籤名稱 (例如 v0.52.0，提供時會將 .dmg 上傳至該 Release)'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: '擴充功能版本號 (選填，留空則讀取 manifest.base.json)'
        required: false
        type: string
      tag_name:
        description: '要附加 .dmg 的 GitHub Release 標籤 (選填，例如 v0.52.0)'
        required: false
        type: string

jobs:
  check-safari-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag_name: ${{ steps.check.outputs.tag_name }}
      dmg_configured: ${{ steps.check.outputs.dmg_configured }}
      appstore_configured: ${{ steps.check.outputs.appstore_configured }}

    steps:
    - name: 檢出程式碼
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: 解析版本與檢查 Apple Secrets
      id: check
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_TAG_NAME: ${{ inputs.tag_name }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
        DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
        CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.EXTENSION_PROVISIONING_PROFILE_BASE64 }}
        APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
      run: |
        VERSION="${INPUT_VERSION#v}"
        if [ -z "$VERSION" ]; then
          VERSION=$(jq -r '.version' platforms/base/manifest.base.json)
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "tag_name=$INPUT_TAG_NAME" >> "$GITHUB_OUTPUT"

        missing_dmg=()
        [ -z "$APPLE_TEAM_ID" ] && missing_dmg+=("APPLE_TEAM_ID")
        [ -z "$DEVELOPER_ID_P12_BASE64" ] && missing_dmg+=("DEVELOPER_ID_P12_BASE64")
        [ -z "$DEVELOPER_ID_P12_PASSWORD" ] && missing_dmg+=("DEVELOPER_ID_P12_PASSWORD")
        [ -z "$APPSTORE_KEY_ID" ] && missing_dmg+=("APPSTORE_KEY_ID")
        [ -z "$APPSTORE_ISSUER_ID" ] && missing_dmg+=("APPSTORE_ISSUER_ID")
        [ -z "$APPSTORE_PRIVATE_KEY" ] && missing_dmg+=("APPSTORE_PRIVATE_KEY")

        if [ ${#missing_dmg[@]} -gt 0 ]; then
          echo "dmg_configured=false" >> "$GITHUB_OUTPUT"
          echo "## 略過 Safari Developer ID .dmg 封裝" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "尚未設定完整的 Developer ID 與公證 secrets（缺少: $(IFS=', '; echo "${missing_dmg[*]}")）。" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "dmg_configured=true" >> "$GITHUB_OUTPUT"
          echo "- ✅ Developer ID 公證 `.dmg` secrets 齊全（將執行 \`publish-safari-dmg\`）" >> "$GITHUB_STEP_SUMMARY"
        fi

        missing_appstore=()
        [ -z "$APPLE_TEAM_ID" ] && missing_appstore+=("APPLE_TEAM_ID")
        [ -z "$CERTIFICATE_P12_BASE64" ] && missing_appstore+=("CERTIFICATE_P12_BASE64")
        [ -z "$CERTIFICATE_PASSWORD" ] && missing_appstore+=("CERTIFICATE_PASSWORD")
        [ -z "$PROVISIONING_PROFILE_BASE64" ] && missing_appstore+=("PROVISIONING_PROFILE_BASE64")
        [ -z "$EXTENSION_PROVISIONING_PROFILE_BASE64" ] && missing_appstore+=("EXTENSION_PROVISIONING_PROFILE_BASE64")
        [ -z "$APPSTORE_KEY_ID" ] && missing_appstore+=("APPSTORE_KEY_ID")
        [ -z "$APPSTORE_ISSUER_ID" ] && missing_appstore+=("APPSTORE_ISSUER_ID")
        [ -z "$APPSTORE_PRIVATE_KEY" ] && missing_appstore+=("APPSTORE_PRIVATE_KEY")

        if [ ${#missing_appstore[@]} -gt 0 ]; then
          echo "appstore_configured=false" >> "$GITHUB_OUTPUT"
          echo "- ⏭️ 尚未設定完整 App Store Distribution secrets（缺少: $(IFS=', '; echo "${missing_appstore[*]}")），略過 \`publish-safari-appstore\`" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "appstore_configured=true" >> "$GITHUB_OUTPUT"
          echo "- ✅ App Store Connect secrets 齊全（將執行 \`publish-safari-appstore\`）" >> "$GITHUB_STEP_SUMMARY"
        fi

  publish-safari-dmg:
    needs: check-safari-secrets
    if: needs.check-safari-secrets.outputs.dmg_configured == 'true'
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
    - name: 檢出程式碼
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'

    - name: 安裝相依套件
      run: npm ci

    - name: 安裝 Developer ID Application 憑證至臨時 Keychain
      env:
        DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
        DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      run: |
        CERT_PATH="$RUNNER_TEMP/devid.p12"
        KEYCHAIN_PATH="$RUNNER_TEMP/build-dmg.keychain-db"
        KEYCHAIN_PASS="askpage-ci-dmg-keychain"

        printf '%s' "$DEVELOPER_ID_P12_BASE64" | tr -d '\r\n' | base64 --decode > "$CERT_PATH"

        security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
        security import "$CERT_PATH" -P "$DEVELOPER_ID_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
        security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
        security find-identity -v -p codesigning

    - name: 建置、Developer ID 簽署並公證 Safari DMG
      env:
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
      run: |
        ./scripts/build-safari-dmg.sh \
          --version "${{ needs.check-safari-secrets.outputs.version }}" \
          --build-number "${{ github.run_number }}"

    - name: 上傳 Safari DMG Artifact
      uses: actions/upload-artifact@v7
      with:
        name: safari-dmg-v${{ needs.check-safari-secrets.outputs.version }}
        path: dist/AskPageExtension-safari_v${{ needs.check-safari-secrets.outputs.version }}.dmg

    - name: 上傳公證後 Safari DMG 至 GitHub Release
      if: needs.check-safari-secrets.outputs.tag_name != ''
      env:
        GH_TOKEN: ${{ github.token }}
        TAG_NAME: ${{ needs.check-safari-secrets.outputs.tag_name }}
        VERSION: ${{ needs.check-safari-secrets.outputs.version }}
      run: |
        gh release upload "$TAG_NAME" "dist/AskPageExtension-safari_v${VERSION}.dmg" --clobber
        echo "✅ 已將公證簽署版 \`AskPageExtension-safari_v${VERSION}.dmg\` 上傳至 Release \`$TAG_NAME\`。" >> "$GITHUB_STEP_SUMMARY"

    - name: 清理臨時 Keychain 與憑證
      if: always()
      run: |
        security delete-keychain "$RUNNER_TEMP/build-dmg.keychain-db" >/dev/null 2>&1 || true
        security list-keychains -d user -s login.keychain-db >/dev/null 2>&1 || true
        rm -f "$RUNNER_TEMP/devid.p12"

  publish-safari-appstore:
    needs: check-safari-secrets
    if: needs.check-safari-secrets.outputs.appstore_configured == 'true'
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
    - name: 檢出程式碼
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'

    - name: 建置 Safari 擴充功能資源
      run: |
        npm ci
        npm run build:safari

    - name: 安裝 Apple 簽署憑證與 Provisioning Profiles
      env:
        CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
        CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.EXTENSION_PROVISIONING_PROFILE_BASE64 }}
      run: |
        CERT_PATH="$RUNNER_TEMP/mac-app-dist.p12"
        APP_PROF_SRC="$RUNNER_TEMP/AskPageApp.provisionprofile"
        EXT_PROF_SRC="$RUNNER_TEMP/AskPageExtension.provisionprofile"
        PROFILE_DIR_NEW="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
        PROFILE_DIR_OLD="$HOME/Library/MobileDevice/Provisioning Profiles"
        mkdir -p "$PROFILE_DIR_NEW" "$PROFILE_DIR_OLD"

        printf '%s' "$CERTIFICATE_P12_BASE64" | tr -d '\r\n' | base64 --decode > "$CERT_PATH"
        printf '%s' "$PROVISIONING_PROFILE_BASE64" | tr -d '\r\n' | base64 --decode > "$APP_PROF_SRC"
        printf '%s' "$EXTENSION_PROVISIONING_PROFILE_BASE64" | tr -d '\r\n' | base64 --decode > "$EXT_PROF_SRC"

        security cms -D -i "$APP_PROF_SRC" > "$RUNNER_TEMP/app-prof.plist"
        APP_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/app-prof.plist")
        security cms -D -i "$EXT_PROF_SRC" > "$RUNNER_TEMP/ext-prof.plist"
        EXT_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/ext-prof.plist")
        echo "APP_PROFILE_UUID=$APP_PROFILE_UUID" >> "$GITHUB_ENV"
        echo "EXT_PROFILE_UUID=$EXT_PROFILE_UUID" >> "$GITHUB_ENV"

        for dir in "$PROFILE_DIR_NEW" "$PROFILE_DIR_OLD"; do
          cp "$APP_PROF_SRC" "$dir/${APP_PROFILE_UUID}.provisionprofile"
          cp "$EXT_PROF_SRC" "$dir/${EXT_PROFILE_UUID}.provisionprofile"
        done

        curl -fsSL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer

        KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
        KEYCHAIN_PASS="askpage-ci-temp-keychain"
        security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
        security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/productbuild
        security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
        security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
        security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
        security find-identity -v "$KEYCHAIN_PATH"

    - name: 封存與匯出 macOS Safari App (.pkg)
      env:
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        VERSION: ${{ needs.check-safari-secrets.outputs.version }}
        BUILD_NUMBER: ${{ github.run_number }}
      run: |
        cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>method</key>
          <string>app-store-connect</string>
          <key>teamID</key>
          <string>${APPLE_TEAM_ID}</string>
          <key>signingStyle</key>
          <string>manual</string>
          <key>signingCertificate</key>
          <string>3rd Party Mac Developer Application</string>
          <key>installerSigningCertificate</key>
          <string>3rd Party Mac Developer Installer</string>
          <key>provisioningProfiles</key>
          <dict>
            <key>com.doggy8088.AskPage</key>
            <string>${APP_PROFILE_UUID}</string>
            <key>com.doggy8088.AskPage.Extension</key>
            <string>${EXT_PROFILE_UUID}</string>
          </dict>
        </dict>
        </plist>
        EOF

        xcodebuild clean archive \
          -project platforms/safari/xcode/AskPage/AskPage.xcodeproj \
          -scheme "AskPage" \
          -configuration Release \
          -destination "generic/platform=macOS" \
          -archivePath "$RUNNER_TEMP/AskPage.xcarchive" \
          ARCHS="arm64 x86_64" \
          ONLY_ACTIVE_ARCH=NO \
          CODE_SIGN_STYLE=Manual \
          CODE_SIGN_IDENTITY="-" \
          DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
          CODE_SIGNING_REQUIRED=NO \
          MARKETING_VERSION="$VERSION" \
          CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

        xcodebuild -exportArchive \
          -archivePath "$RUNNER_TEMP/AskPage.xcarchive" \
          -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
          -exportPath "$RUNNER_TEMP/export"

        PKG_PATH=$(find "$RUNNER_TEMP/export" -name "*.pkg" | head -n 1)
        if [ -z "$PKG_PATH" ]; then
          echo "❌ 找不到匯出的 .pkg 檔案"
          exit 1
        fi
        pkgutil --check-signature "$PKG_PATH"

    - name: 上傳至 App Store Connect
      env:
        APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
      run: |
        mkdir -p "$HOME/.appstoreconnect/private_keys"
        printf '%s\n' "$APPSTORE_PRIVATE_KEY" | tr -d '\r' > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
        chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"

        PKG_PATH=$(find "$RUNNER_TEMP/export" -name "*.pkg" | head -n 1)
        if [ -z "$PKG_PATH" ]; then
          echo "❌ 找不到匯出的 .pkg 檔案"
          exit 1
        fi

        xcrun altool --upload-app \
          -f "$PKG_PATH" \
          -t osx \
          --apiKey "$APPSTORE_KEY_ID" \
          --apiIssuer "$APPSTORE_ISSUER_ID"

    - name: 清理臨時憑證與金鑰
      if: always()
      run: |
        security delete-keychain "$RUNNER_TEMP/build.keychain-db" >/dev/null 2>&1 || true
        security list-keychains -d user -s login.keychain-db >/dev/null 2>&1 || true
        rm -f \
          "$RUNNER_TEMP/mac-app-dist.p12" \
          "$RUNNER_TEMP/AppleWWDRCAG3.cer" \
          "$RUNNER_TEMP/AskPageApp.provisionprofile" \
          "$RUNNER_TEMP/AskPageExtension.provisionprofile" \
          "$RUNNER_TEMP/app-prof.plist" \
          "$RUNNER_TEMP/ext-prof.plist" \
          "$RUNNER_TEMP/ExportOptions.plist"
        if [ -n "${APP_PROFILE_UUID:-}" ]; then
          rm -f \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/${APP_PROFILE_UUID}.provisionprofile" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/${APP_PROFILE_UUID}.provisionprofile"
        fi
        if [ -n "${EXT_PROFILE_UUID:-}" ]; then
          rm -f \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/${EXT_PROFILE_UUID}.provisionprofile" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/${EXT_PROFILE_UUID}.provisionprofile"
        fi
        rm -rf "$HOME/.appstoreconnect/private_keys"
