name: 自動化發布

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-release:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}

    steps:
    - name: 取出程式碼
      uses: actions/checkout@v7

    - name: 檢查版本是否已發布
      id: check
      env:
        EVENT_NAME: ${{ github.event_name }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        version=$(jq -r '.version' manifest.json)
        tag="v$version"

        # 手動觸發或重新執行時一律發布，保留補救失敗發布的途徑
        if [ "$EVENT_NAME" != "push" ] || [ "$RUN_ATTEMPT" != "1" ]; then
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        set +e
        git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null
        status=$?
        set -e

        case "$status" in
          0)
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "## 略過發布" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "標籤 $tag 已存在，表示 manifest.json 版本 $version 已發布過，本次推送不重新建立 Release 或上傳 Chrome Web Store。" >> "$GITHUB_STEP_SUMMARY"
            echo "若需重新發布此版本，請重新執行此 workflow 或以 workflow_dispatch 手動觸發。" >> "$GITHUB_STEP_SUMMARY"
            ;;
          2)
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "::error::無法查詢遠端標籤 $tag（git ls-remote exit code $status）"
            exit 1
            ;;
        esac

  publish:
    needs: check-release
    if: needs.check-release.outputs.should_publish == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: 取出程式碼
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Get version
      id: get_version
      run: |
        version=$(jq -r '.version' manifest.json)
        echo "version=$version" >> $GITHUB_OUTPUT

    - name: 建立 GitHub Release
      id: create_release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: v${{ steps.get_version.outputs.version }}
        name: 頁問 v${{ steps.get_version.outputs.version }}
        draft: false
        prerelease: false

    - name: Create ZIP package
      run: |
        filePath="AskPageExtension_v${{ steps.get_version.outputs.version }}.zip"
        zip -r "$filePath" manifest.json background.js content.js popup.html popup.js settings.html settings.js codepen.html codepen.js i18n.js style.css icons lib _locales CHANGELOG.md README.md

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v3
      with:
        tag_name: v${{ steps.get_version.outputs.version }}
        files: ./AskPageExtension_v${{ steps.get_version.outputs.version }}.zip

    - name: Check Chrome Web Store Secrets
      run: |
        missing_secrets=()

        if [ -z "${{ secrets.EXTENSION_ID }}" ]; then
          missing_secrets+=("EXTENSION_ID")
        fi
        if [ -z "${{ secrets.CLIENT_ID }}" ]; then
          missing_secrets+=("CLIENT_ID")
        fi
        if [ -z "${{ secrets.CLIENT_SECRET }}" ]; then
          missing_secrets+=("CLIENT_SECRET")
        fi
        if [ -z "${{ secrets.REFRESH_TOKEN }}" ]; then
          missing_secrets+=("REFRESH_TOKEN")
        fi

        if [ ${#missing_secrets[@]} -gt 0 ]; then
          echo "❌ Chrome Web Store API 相關 secrets 未完整設定"
          echo "缺少的 secrets: $(IFS=', '; echo "${missing_secrets[*]}")"
          echo "請到 GitHub Repository Settings > Secrets and variables > Actions 設定以下 secrets:"
          for secret in "${missing_secrets[@]}"; do
            echo "  - $secret"
          done
          exit 1
        else
          echo "✅ 所有必要的 Chrome Web Store secrets 都已設定"
        fi

    - name: Upload to Chrome Web Store
      uses: mnao305/chrome-extension-upload@v6.0.0
      with:
        file-path: 'AskPageExtension_v${{ steps.get_version.outputs.version }}.zip'
        extension-id: ${{ secrets.EXTENSION_ID }}
        client-id: ${{ secrets.CLIENT_ID }}
        client-secret: ${{ secrets.CLIENT_SECRET }}
        refresh-token: ${{ secrets.REFRESH_TOKEN }}
        publish: true

    - name: Chrome Web Store publish note
      run: |
        echo "Chrome Web Store 套件已上傳。" >> $GITHUB_STEP_SUMMARY
        echo "已透過 Chrome Web Store API 送出發布。" >> $GITHUB_STEP_SUMMARY
