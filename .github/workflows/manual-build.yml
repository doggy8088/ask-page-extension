name: 手動套件建構

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本號 (例如: v1.0.0)'
        required: true
        type: string
      create_release:
        description: '是否建立 GitHub Release'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 檢出程式碼
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: 設定 Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'

    - name: 安裝相依套件
      run: npm ci

    - name: 設定版本號
      id: version
      run: |
        VERSION="${{ github.event.inputs.version }}"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "version_number=${VERSION#v}" >> $GITHUB_OUTPUT

    - name: 建置並打包三平台套件
      run: |
        VERSION_NUMBER="${{ steps.version.outputs.version_number }}"
        node scripts/package.js --version="$VERSION_NUMBER"

        for target in chrome edge safari; do
          pkg="dist/AskPageExtension-${target}_v${VERSION_NUMBER}.zip"
          if [ ! -f "$pkg" ]; then
            echo "❌ 缺少打包產物: $pkg"
            exit 1
          fi
          SIZE=$(du -k "$pkg" | cut -f1)
          echo "$target 套件大小: ${SIZE}KB ($pkg)"
        done

    - name: 上傳套件到 Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: extension-packages-${{ steps.version.outputs.version }}
        path: dist/AskPageExtension-*_v${{ steps.version.outputs.version_number }}.zip

    - name: 建立 GitHub Release
      if: ${{ github.event.inputs.create_release == 'true' }}
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: 頁問 ${{ steps.version.outputs.version }}
        files: |
          dist/AskPageExtension-chrome_v${{ steps.version.outputs.version_number }}.zip
          dist/AskPageExtension-edge_v${{ steps.version.outputs.version_number }}.zip
          dist/AskPageExtension-safari_v${{ steps.version.outputs.version_number }}.zip
        generate_release_notes: true
        draft: true
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 建構總結
      run: |
        VERSION_NUMBER="${{ steps.version.outputs.version_number }}"
        echo "## 多平台套件建構完成 ✅" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 套件資訊:" >> $GITHUB_STEP_SUMMARY
        echo "- 🏷️ 版本號: \`${VERSION_NUMBER}\`" >> $GITHUB_STEP_SUMMARY
        for target in chrome edge safari; do
          pkg="dist/AskPageExtension-${target}_v${VERSION_NUMBER}.zip"
          SIZE=$(du -k "$pkg" | cut -f1)
          echo "- 📦 ${target}: \`${pkg}\` (${SIZE}KB)" >> $GITHUB_STEP_SUMMARY
        done
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ "${{ github.event.inputs.create_release }}" = "true" ]; then
          echo "### 📢 GitHub Release" >> $GITHUB_STEP_SUMMARY
          echo "已建立草稿 Release，請前往 [Releases](../../releases) 頁面檢查並發布" >> $GITHUB_STEP_SUMMARY
        else
          echo "### 📥 下載套件" >> $GITHUB_STEP_SUMMARY
          echo "三平台套件已上傳到 Artifacts，請到 Actions 頁面下載" >> $GITHUB_STEP_SUMMARY
        fi
